[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py7zip"
version = "1.2.0"
description = "Modern, bilingual Tkinter archive manager for 7z, zip, tar, gzip, bzip2 and xz"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-2.1" }
authors = [
    { name = "Py7-Zip contributors" },
]
keywords = ["archive", "7z", "zip", "tar", "compression", "tkinter", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Desktop Environment",
]
dependencies = [
    "py7zr>=1.0.0,<2",
]

[project.optional-dependencies]
images = ["pillow>=10.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
py7zip = "py7zip.main:main"

[project.gui-scripts]
py7zip-gui = "py7zip.main:main"

[project.urls]
Source = "https://github.com/mcmilk/7-Zip"

[tool.setuptools]
packages = [
    "py7zip",
    "py7zip.engine",
    "py7zip.ui",
    "py7zip.resources",
    "py7zip.locales",
]

[tool.setuptools.package-data]
py7zip = ["resources/*.png"]
